<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

    <!-- Navigation Bar -->
    <nav class="navbar navbar-dark bg-cyan-dark shadow-sm">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1 fw-bold">
                <i class="bi bi-check2-circle me-2"></i>My To-Do List
            </span>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow-lg border-0 p-4 rounded-4">
                    
                    <!-- Header -->
                    <div class="text-center mb-4">
                        <h2 class="fw-bold text-cyan-heading">Task Manager</h2>
                        <p class="text-muted">Organize your tasks and stay productive</p>
                    </div>

                    <!-- Input Section -->
                    <div class="input-group mb-1">
                        <input type="text" id="taskInput" class="form-control form-control-lg custom-input" placeholder="Enter a new task...">
                        <button class="btn btn-cyan text-white px-4 fw-semibold" id="addTaskBtn" type="button">
                            <i class="bi bi-plus-lg me-1"></i>Add Task
                        </button>
                    </div>
                    <div id="errorMsg" class="text-danger small mb-3 d-none">
                        <i class="bi bi-exclamation-circle me-1"></i>Please enter a valid task (cannot be empty).
                    </div>

                    <!-- Tasks Header & Counter -->
                    <div class="d-flex justify-content-between align-items-center mb-3 mt-4">
                        <span class="fw-semibold text-secondary">Your tasks</span>
                        <span id="taskCounter" class="badge bg-cyan-badge px-3 py-2">0 remaining</span>
                    </div>

                    <!-- Filter Buttons -->
                    <div class="btn-group w-100 mb-4" role="group" aria-label="Filter Tasks">
                        <button type="button" class="btn btn-outline-cyan active filter-btn" data-filter="all">All</button>
                        <button type="button" class="btn btn-outline-cyan filter-btn" data-filter="active">Active</button>
                        <button type="button" class="btn btn-outline-cyan filter-btn" data-filter="completed">Completed</button>
                    </div>

                    <!-- Task List Container -->
                    <ul id="taskList" class="list-group mb-3">
                        <!-- Dynamic items will be inserted here -->
                    </ul>

                    <!-- Empty State Message -->
                    <div id="emptyState" class="text-center text-muted py-4">
                        <i class="bi bi-card-checklist display-6 text-cyan-light d-block mb-2"></i>
                        No tasks yet. Add your first task!
                    </div>

                    <!-- Clear Completed Button -->
                    <div class="text-end">
                        <button id="clearCompletedBtn" class="btn btn-outline-danger btn-sm rounded-pill px-3">
                            <i class="bi bi-trash3 me-1"></i>Clear Completed
                        </button>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JavaScript -->
    <script src="script.js"></script>
</body>
</html>
